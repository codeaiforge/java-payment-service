spring.application.name=payment-service

# Schema is owned by Flyway (db/migration); Hibernate only checks the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The external account system. Locally this is the WireMock container in docker-compose.yml
# serving the fictional accounts in wiremock/mappings. Example value only.
account-system.url=http://localhost:8089

# The external authorization and limit systems. Locally the same WireMock plays all three
# systems (wiremock/mappings); in a real deployment each has its own URL. Example values only.
authorization-system.url=http://localhost:8089
limit-system.url=http://localhost:8089

# Spring's own errors (missing fields, unreadable JSON) use the same problem-details body as ours.
spring.mvc.problemdetails.enabled=true

# Observability. Logs are JSON (Elastic Common Schema), one object per line, with the request's correlationId.
# Prometheus scrapes /actuator/prometheus; health is there for the container platform. Nothing else is exposed.
logging.structured.format.console=ecs
management.endpoints.web.exposure.include=health,prometheus

# The external payment system, which moves the money. Locally the same WireMock again. Example value only.
payment-system.url=http://localhost:8089

# Resilience. Every external call has a deadline. Feign's defaults (10s to connect, 60s to read) would hold
# a request thread for a minute behind a system that has stopped answering.
spring.cloud.openfeign.client.config.default.connect-timeout=1000
spring.cloud.openfeign.client.config.default.read-timeout=2000
# Moving money is slower than answering a question, and every timeout here leaves a payment whose outcome
# we don't know (docs/episodes/16), so the payment system gets longer.
spring.cloud.openfeign.client.config.payment-system.read-timeout=5000

# Retried: no answer (connection refused, timeout) and 5xx. Not retried: 4xx, which would fail the same way again.
# Only the account, authorization and limit adapters use a Retry; payment execution never does.
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=200ms
resilience4j.retry.configs.default.enable-exponential-backoff=true
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions=feign.RetryableException,feign.FeignException$FeignServerException

# One circuit breaker per external system. When at least half of its last 10 calls failed, calls stop for 10s
# and fail at once; then 2 trial calls decide whether it is back. A 404 from the account system is an answer,
# not a failure, so only the same exceptions as above count.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.configs.default.record-exceptions=feign.RetryableException,feign.FeignException$FeignServerException

# Asynchronous processing (docs/episodes/17). POST /execute publishes a PaymentProcessingMessage to the
# payment-processing topic; this service also consumes it. Locally the broker is Kafka from docker-compose.yml on
# localhost:9092, Spring's default spring.kafka.bootstrap-servers.
spring.kafka.consumer.group-id=payment-service
# A message published before this consumer first joined the group is still processed.
spring.kafka.consumer.auto-offset-reset=earliest
# Values are JSON, except payment-events' (config/MessagingConfiguration): no type headers, the topic says the type.
spring.kafka.producer.properties.spring.json.add.type.headers=false
# A message that isn't valid JSON fails once and goes to the dead-letter topic, instead of failing forever.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.payment.infrastructure.adapter.primary.messaging.PaymentProcessingMessage
# Every message carries the request's X-Correlation-Id.
spring.kafka.producer.properties.interceptor.classes=com.example.payment.infrastructure.observability.CorrelationIdProducerInterceptor
# A deadline for the broker too (Episode 16): without these, a publish to a broker that is down blocks the
# request for up to 2 minutes. delivery.timeout.ms must be at least request.timeout.ms + linger.ms.
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
# A message whose processing throws (an external system down) is tried again 5s, 10s and 20s later through
# retry topics, so it doesn't hold up the messages behind it. After the 4th attempt it is parked in
# payment-processing-dlt and the payment stays as it is: POST /execute again once the outage is over.
spring.kafka.retry.topic.enabled=true
spring.kafka.retry.topic.attempts=4
spring.kafka.retry.topic.backoff.delay=5s
spring.kafka.retry.topic.backoff.multiplier=2
# Reconciliation (docs/episodes/bonus-02). Every interval, payments PROCESSING for longer than the threshold are
# settled by asking the payment system. The threshold must be longer than the payment system's deadline above
# (1s connect + 5s read), so a run never asks about a payment whose execute is still waiting for its answer.
payment.reconciliation.interval=1m
payment.reconciliation.threshold=2m
# Refunds left PROCESSING are settled by the same run, with the same threshold (docs/episodes/bonus-07).
# One instance runs it at a time (ShedLock). A run that hangs or whose instance dies holds the lock at most 10m, far
# longer than a run should take: the payment system's 6s deadline per stuck payment. A run that ends early keeps it 30s,
# half the interval, so the fleet runs about once per interval rather than once per instance.
payment.reconciliation.lock-at-most-for=10m
payment.reconciliation.lock-at-least-for=30s

# Payment events (docs/episodes/bonus-03). Final status changes are written to the payment_outbox table with the
# change itself; the relay sends unpublished rows to the payment-events topic, oldest first, this many per run.
payment.events.relay-interval=1s
payment.events.relay-batch-size=100
# Published rows are kept this long, as the record of what was sent, then deleted by one instance each interval.
payment.events.retention=7d
payment.events.cleanup-interval=1h

# Distributed tracing (docs/episodes/bonus-05). Spring traces HTTP requests, Feign calls and scheduled runs on its own;
# Kafka only when asked: the send puts a traceparent header on the message and the listener continues that trace, so
# POST /execute, the consumer and its calls (retry topics too) are one trace. Every log line carries traceId and spanId.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true
# Spans go to Tempo (docker-compose.yml) over OTLP/HTTP. Example value only. Metrics stay with Prometheus: the
# OpenTelemetry starter would also push them over OTLP, to a receiver that takes only traces.
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=false
# 10% of traces are kept (Boot's default, written out), decided once where a trace starts and followed by every hop
# after it. Each kept trace costs a span per hop to build, send and store; at production volume 10% still shows every
# slow path. The local profile keeps them all.
management.tracing.sampling.probability=0.1

# Centralized logs (docs/episodes/bonus-06). logback-spring.xml sends every line to the console and, through the
# OpenTelemetry logs SDK, to Loki over OTLP/HTTP. Example value only. Loki makes service_name (spring.application.name)
# and the environment below labels; trace_id, span_id and correlationId stay structured metadata on each line.
management.opentelemetry.logging.export.otlp.endpoint=http://localhost:3100/otlp/v1/logs
management.opentelemetry.resource-attributes[deployment.environment.name]=local
# Records wait in a bounded queue and leave in batches from a background thread, so a slow or absent Loki never holds
# a request. A full queue drops new records, the console still has them. Boot's defaults, written out.
management.opentelemetry.logging.export.max-queue-size=2048
management.opentelemetry.logging.export.max-batch-size=512
management.opentelemetry.logging.export.schedule-delay=1s

# Alerting and SLOs (docs/episodes/bonus-08). The latency SLO counts POST /payments answered within 500ms, so the request
# timer publishes a histogram bucket at exactly that boundary. Not percentiles-histogram: that is about 70 buckets for
# every uri, method, status and outcome, to answer one question this bucket already answers.
management.metrics.distribution.slo.http.server.requests=500ms
# Buckets carry exemplars (the trace ID of a request that landed in them) whenever tracing has sampled that request.
# Prometheus asks for them in the OpenMetrics format, and Grafana links each one to the trace in Tempo.

# Payment statement (docs/episodes/bonus-09). A read model in its own tables, fed from payment-events by its own consumer
# group (payment-statement). The topic keeps every event forever (PaymentEventsTopic), so the statement can be rebuilt
# by replaying it. A topic that already exists is brought in line with that configuration at start-up.
spring.kafka.admin.modify-topic-configs=true

# Versioned event schemas (docs/episodes/bonus-10). payment-events carries Avro, written with the schema in
# src/main/avro and registered in Apicurio Registry (docker-compose.yml) as payment-events-value. The registry refuses a
# version that breaks FULL_TRANSITIVE compatibility; the contract test refuses it first, in the build. Example value only.
spring.kafka.properties.apicurio.registry.url=http://localhost:8085/apis/registry/v3
# SHORTCUT: the relay registers its schema on first send. With more producers or stricter control, the build registers
# schemas and producers only look them up (auto-register=false, find-latest=true).
spring.kafka.producer.properties.apicurio.registry.auto-register=true
# Registered whole, as one schema: by default the serializer would register the PaymentEventType enum as an artifact of
# its own, referenced from the event's, and every consumer and tool would have to resolve the reference.
spring.kafka.producer.properties.apicurio.registry.dereference-schema=true

# Webhooks (docs/episodes/bonus-11). Each payment event is queued for every active endpoint of the payer (consumer group
# payment-webhooks); every instance's dispatcher sends what is due this often.
payment.webhooks.dispatch-interval=1s
# The SSL bundle (spring.ssl.bundle.*) whose trust store checks endpoints' certificates. Empty: the JVM's default CAs.
payment.webhooks.ssl-bundle=
# Addresses exempt from the check that refuses loopback, private and link-local hosts. Only the tests set it, to reach the
# WireMock merchant on 127.0.0.1. Set anywhere else, it opens the network the check exists to keep customers out of.
payment.webhooks.allowed-private-addresses=

# Kafka's clients log their whole configuration at INFO, once per producer and consumer.
logging.level.org.apache.kafka=WARN

# Rate limits per customer (docs/episodes/bonus-12). Every authenticated request takes a token from the customer's
# requests bucket, and POST /payments one from their payments bucket too; an empty bucket is a 429 with Retry-After.
# Buckets refill steadily and hold at most one period's worth, so a quiet customer can burst up to the limit at once.
# The buckets are rows in PostgreSQL (rate_limit_bucket), shared by every instance. Example values only.
# SHORTCUT: the same limits for every customer; per-tier limits would read the tier from the token.
payment.rate-limit.requests-per-second=20
payment.rate-limit.payments-per-minute=10

# Kubernetes (docs/episodes/bonus-13). /actuator/health/liveness says only "the process works": a database outage
# restarting every pod would make it worse. /actuator/health/readiness says "send me requests": it turns away traffic
# while starting and stopping, and doesn't include the database either (the episode explains why). /actuator/health
# still includes everything, for people.
management.endpoint.health.probes.enabled=true
# On SIGTERM: stop accepting connections, let the requests in hand finish, then stop the Kafka listeners (the record in
# hand is finished and its offset committed) and the schedulers (a run in hand finishes and releases its lock). Each
# phase gets at most this long. The pod's terminationGracePeriodSeconds (deploy/k8s/base) must cover its preStop sleep
# plus all of it.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
