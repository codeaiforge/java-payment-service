# Only with the agent profile (docs/episodes/bonus-14): the operations agent and its chat model.
# Ollama by default, from docker-compose.yml (docker compose --profile agent up -d ollama). Add the anthropic or openai
# profile to use one of those instead; each reads its key from the environment.
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
# A small model that can answer in a given JSON shape. Pulled on first start if missing, which takes a few minutes.
spring.ai.ollama.chat.options.model=${AGENT_OLLAMA_MODEL:qwen2.5:3b}
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=15m
# ./mvnw spring-boot:run starts docker-compose.yml; with this profile it starts the ollama service too.
spring.docker.compose.profiles.active=agent
