# Grafana Loki for local use (docs/episodes/bonus-06): one process, receives log records over OTLP/HTTP on 3100
# (/otlp/v1/logs), keeps them on the container's disk, answers Grafana on the same port. Its ruler evaluates the
# log-based alerts in observability/loki/rules (docs/episodes/bonus-08).
auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Logs are operational: kept 7 days, then the compactor deletes them. The record that must be kept is the audit
# table (docs/episodes/13), not the logs.
limits_config:
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Rules are read from files (the tenant's directory under /etc/loki/rules) and what fires goes to Alertmanager.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
