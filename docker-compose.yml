# The local environment. Two ways to use it:
#   ./mvnw spring-boot:run            Spring Boot starts the infrastructure below and the service runs on the host.
#   docker compose --profile app up   the service runs in a container too, configured only by environment variables.
# The named volume keeps the data between restarts. Every credential and address here is an example for local
# containers only. Nothing points at a real system.
services:
  payment-service:
    profiles: [app]
    build: .
    # Like a container platform: a service that dies at start-up (Kafka not up yet) is started again.
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      # Accepts tokens signed with the local key (application-local.properties). A real deployment sets
      # SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI instead.
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: payments
      SPRING_DATASOURCE_PASSWORD: payments
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      ACCOUNT_SYSTEM_URL: http://account-system:8080
      AUTHORIZATION_SYSTEM_URL: http://account-system:8080
      LIMIT_SYSTEM_URL: http://account-system:8080
      PAYMENT_SYSTEM_URL: http://account-system:8080
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      MANAGEMENT_OPENTELEMETRY_LOGGING_EXPORT_OTLP_ENDPOINT: http://loki:3100/otlp/v1/logs
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      account-system:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432"
    volumes:
      - payments-data:/var/lib/postgresql
    # Flyway migrates at start-up, so the service waits until PostgreSQL accepts connections.
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "payments", "-d", "payments"]
      interval: 2s
      retries: 15

  # A stand-in for the external account, authorization, limit and payment systems, serving the
  # fictional data in wiremock/mappings. Unknown accounts get WireMock's default 404.
  # Also Alertmanager's pager and ticket queue (docs/episodes/bonus-08): http://localhost:8089/__admin/requests.
  account-system:
    image: wiremock/wiremock:3.13.2
    ports:
      - "8089:8080"
    volumes:
      - ./wiremock:/home/wiremock:ro

  # The message broker for asynchronous processing (docs/episodes/17). A single node, no replication:
  # local use only. Spring Boot has no Docker Compose connection for Kafka, so it uses a fixed port,
  # localhost:9092, which is also Spring's default bootstrap server.
  # A broker tells clients which address to reconnect to, so it needs one listener per network:
  # localhost:9092 for the service on the host, kafka:19092 for the service in a container.
  # Setting any KAFKA_ variable replaces the image's whole default configuration, hence the full list.
  kafka:
    image: apache/kafka-native:4.1.1
    # The native image's start-up very occasionally segfaults (seen once in about 20 starts). Start it again.
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Scrapes the running service's /actuator/prometheus every 5s (observability/prometheus.yml), in its
  # container or on the host, and evaluates the alert rules in observability/prometheus/rules (docs/episodes/bonus-08).
  # Exemplar storage keeps the trace IDs the scrape carries, for Grafana's links to Tempo.
  prometheus:
    image: prom/prometheus:v3.7.3
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--enable-feature=exemplar-storage"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/rules:/etc/prometheus/rules:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Receives the service's spans (docs/episodes/bonus-05) on 4318, in its container or on the host.
  # Grafana reads them from 3200: Explore > Tempo, search by trace ID (every log line has one).
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "4318:4318"
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro

  # Receives the service's log lines (docs/episodes/bonus-06) over OTLP on 3100, in its container or on the host,
  # and keeps them 7 days. Grafana: Explore > Loki, {service_name="payment-service"}.
  # Its ruler evaluates the log-based alerts in observability/loki/rules (docs/episodes/bonus-08).
  loki:
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yaml:/etc/loki.yaml:ro
      - ./observability/loki/rules:/etc/loki/rules/fake:ro

  # Receives what fires from Prometheus and Loki, groups it, holds back what another alert explains, and sends it on
  # (observability/alertmanager.yml, docs/episodes/bonus-08). http://localhost:9093 shows what is firing and silenced.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  # http://localhost:3000, anonymous admin, Prometheus, Tempo and Loki already set up as data sources. Local use only.
  grafana:
    image: grafana/grafana:12.2.1
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro

volumes:
  payments-data:
